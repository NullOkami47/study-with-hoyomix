name = "study-with-hoyomix-local"
main = "workers/index.ts"
compatibility_date = "2025-12-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "study-with-hoyomix"
database_id = "local"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "OnlinePresence"

[[migrations]]
tag = "presence-v1"
new_sqlite_classes = ["OnlinePresence"]

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "community-chat-v1"
new_sqlite_classes = ["ChatRoom"]

[[ratelimits]]
name = "AUTH_START_LIMITER"
namespace_id = "20261027"
simple = { limit = 20, period = 60 }

# Optional hourly maintenance and discovery schedule for deployed Workers:
# [triggers]
# crons = ["17 * * * *"]

[vars]
PUBLIC_ORIGIN = "http://localhost:8787"
